services:
  - type: web
    name: ali-dandash-portfolio-static
    runtime: static
    buildCommand: npm ci && npm run build:static
    staticPublishPath: ./static-dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_PORTFOLIO_ADMIN_EMAIL
        value: alimjdandash@gmail.com
