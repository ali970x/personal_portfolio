services:
  - type: web
    name: ali-dandash-portfolio
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: NEXT_PUBLIC_SITE_URL
        value: https://ali-dandash-portfolio.onrender.com
